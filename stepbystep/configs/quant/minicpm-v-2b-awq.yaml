model_name: MiniCPM-V-2B
model_id: openbmb/MiniCPM-V-2
local_path: null
loader:
  class: AutoModel
  processor_class: AutoTokenizer
  trust_remote_code: true
  torch_dtype: float16
  device_map: auto
  quantization: awq
inference:
  max_new_tokens: 32
  do_sample: false
  system_prompt: 'You are a helpful assistant. Answer with only the choice letter
    (A/B/C/D/E/F)

    for multiple choice questions, or only ''Yes''/''No'' for binary questions.

    Do not explain. One character only.'
eriq:
  supported_modalities:
  - single_image
  - multi_image
  - interleaved
  answer_extraction_mode: first_letter
awq_model_id: openbmb/MiniCPM-V-2-AWQ
processor_id: openbmb/MiniCPM-V-2
