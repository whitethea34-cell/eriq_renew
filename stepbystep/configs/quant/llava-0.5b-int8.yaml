model_name: LLaVA-OneVision-0.5B
model_id: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
local_path: null
source: modelscope
modelscope_id: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
modelscope_cache_dir: /mnt/e/Projects/eriq-eval/models
loader:
  class: LlavaOnevisionForConditionalGeneration
  processor_class: AutoProcessor
  trust_remote_code: true
  torch_dtype: float16
  device_map: auto
  quantization: 8bit
inference:
  max_new_tokens: 32
  do_sample: false
  system_prompt: 'You are a helpful assistant. Answer with only the choice letter
    (A/B/C/D/E/F)

    for multiple choice questions, or only ''Yes''/''No'' for binary questions.

    Do not explain. One character only.'
eriq:
  supported_modalities:
  - single_image
  - multi_image
  - interleaved
  answer_extraction_mode: first_letter
