model_name: InternLM-XComposer2.5-7B-AWQ
model_id: internlm/internlm-xcomposer2d5-7b-awq
local_path: null
source: modelscope
modelscope_id: internlm/internlm-xcomposer2d5-7b-awq
modelscope_cache_dir: /mnt/e/Projects/eriq-eval/models
loader:
  class: IXC2_5_VLForConditionalGeneration
  processor_class: AutoProcessor
  trust_remote_code: true
  torch_dtype: float16
  device_map: auto
deployment:
  framework: vLLM
  enable_chunked_prefill: true
  kv_cache_quantization: true
  max_model_len: 4096
  gpu_memory_utilization: 0.9
  quantization: awq
inference:
  max_new_tokens: 32
  do_sample: false
  system_prompt: 'You are a helpful assistant. Answer with only the choice letter
    (A/B/C/D/E/F)

    for multiple choice questions, or only ''Yes''/''No'' for binary questions.

    Do not explain. One character only.'
eriq:
  supported_modalities:
  - single_image
  - multi_image
  - interleaved
  answer_extraction_mode: first_letter
